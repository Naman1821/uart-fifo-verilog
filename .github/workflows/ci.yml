name: RTL CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install simulator, linter and synthesis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys
          pip install -r requirements.txt

      - name: Lint (Verilator -Wall)
        run: make lint

      - name: Simulate (cocotb + Icarus Verilog)
        run: make test

      - name: Synthesize (Yosys)
        run: make synth
